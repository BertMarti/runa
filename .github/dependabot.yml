version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Espera una semana antes de proponer una versión recién publicada:
    # da tiempo a detectar paquetes comprometidos.
    cooldown:
      default-days: 7
    ignore:
      # Node 24 es la LTS objetivo: los tipos siguen su versión mayor.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint aún no admite TypeScript 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Solo versiones LTS de Node: se actualiza el digest, no la versión mayor.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gomod
    directory: /cli
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
